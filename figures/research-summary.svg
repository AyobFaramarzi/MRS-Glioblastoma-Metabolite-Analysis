<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="white"/><text x="60" y="65" font-family="Arial" font-size="34" font-weight="700">MRS Glioblastoma — Metabolite Analysis Summary</text><text x="60" y="100" font-family="Arial" font-size="18" fill="#555">Original visual summary based on the published study</text><line x1="60" y1="125" x2="1140" y2="125" stroke="#ccc"/><text x="60" y="170" font-family="Arial" font-size="22" font-weight="700">Study design</text><rect x="60" y="195" width="250" height="90" rx="16" fill="#f4f4f4" stroke="#888"/><text x="185" y="232" text-anchor="middle" font-family="Arial" font-size="22">8 GBM patients</text><text x="185" y="260" text-anchor="middle" font-family="Arial" font-size="17">170 tumor + 205 normal voxels</text><rect x="355" y="195" width="250" height="90" rx="16" fill="#f4f4f4" stroke="#888"/><text x="480" y="232" text-anchor="middle" font-family="Arial" font-size="22">3T multivoxel MRS</text><text x="480" y="260" text-anchor="middle" font-family="Arial" font-size="17">PRESS • TE 135 ms • TR 1570 ms</text><rect x="650" y="195" width="250" height="90" rx="16" fill="#f4f4f4" stroke="#888"/><text x="775" y="232" text-anchor="middle" font-family="Arial" font-size="22">SIVIC + TARQUIN</text><text x="775" y="260" text-anchor="middle" font-family="Arial" font-size="17">LCModel-based fitting</text><rect x="945" y="195" width="195" height="90" rx="16" fill="#f4f4f4" stroke="#888"/><text x="1042" y="232" text-anchor="middle" font-family="Arial" font-size="21">MATLAB + SPSS</text><text x="1042" y="260" text-anchor="middle" font-family="Arial" font-size="16">quantification + statistics</text><text x="60" y="350" font-family="Arial" font-size="22" font-weight="700">Diagnostic performance (AUC)</text><line x1="100" y1="600" x2="700" y2="600" stroke="#333"/><line x1="100" y1="390" x2="100" y2="600" stroke="#333"/><text x="82" y="604" text-anchor="end" font-family="Arial" font-size="13">0.0</text><text x="82" y="505" text-anchor="end" font-family="Arial" font-size="13">0.5</text><text x="82" y="405" text-anchor="end" font-family="Arial" font-size="13">1.0</text><g font-family="Arial" font-size="14" text-anchor="middle"><rect x="145" y="461" width="75" height="139" fill="#777"/><text x="182" y="449">0.915</text><text x="182" y="625">Pcho/Cr</text><rect x="285" y="466" width="75" height="134" fill="#888"/><text x="322" y="454">0.879</text><text x="322" y="625">Pcho/NAA</text><rect x="425" y="472" width="75" height="128" fill="#999"/><text x="462" y="460">0.845</text><text x="462" y="625">NAAG</text><rect x="565" y="490" width="75" height="110" fill="#aaa"/><text x="602" y="478">0.759</text><text x="602" y="625">NAA</text></g><text x="820" y="350" font-family="Arial" font-size="22" font-weight="700">Key metabolic pattern</text><rect x="820" y="380" width="320" height="185" rx="18" fill="#f7f7f7" stroke="#999"/><text x="980" y="420" text-anchor="middle" font-family="Arial" font-size="18">Higher in normal voxels</text><text x="980" y="452" text-anchor="middle" font-family="Arial" font-size="17">Cr • Glu • NAA • NAAG • Gly/Tau</text><text x="980" y="493" text-anchor="middle" font-family="Arial" font-size="18">Higher in tumor voxels</text><text x="980" y="525" text-anchor="middle" font-family="Arial" font-size="17">Gly • Gln • Tau • Lac/Cr • Pcho/Cr</text><text x="60" y="675" font-family="Arial" font-size="15" fill="#555">AUC values are reported in Table 4 of the article; visual layout is original.</text></svg>