<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="white"/><text x="60" y="65" font-family="Arial" font-size="34" font-weight="700">GBM Multivoxel MRS — Metabolite Study</text><text x="60" y="100" font-family="Arial" font-size="18" fill="#555">Original visual summary based on the published study</text><line x1="60" y1="125" x2="1140" y2="125" stroke="#ccc"/><text x="60" y="170" font-family="Arial" font-size="22" font-weight="700">Study sample</text><rect x="60" y="200" width="250" height="95" rx="18" fill="#f4f4f4" stroke="#999"/><text x="185" y="238" text-anchor="middle" font-family="Arial" font-size="22">8 GBM patients</text><text x="185" y="268" text-anchor="middle" font-family="Arial" font-size="17">3T multivoxel MRS</text><rect x="350" y="200" width="250" height="95" rx="18" fill="#f4f4f4" stroke="#999"/><text x="475" y="238" text-anchor="middle" font-family="Arial" font-size="22">170 tumoral voxels</text><text x="475" y="268" text-anchor="middle" font-family="Arial" font-size="17">vs 205 normal voxels</text><rect x="640" y="200" width="250" height="95" rx="18" fill="#f4f4f4" stroke="#999"/><text x="765" y="238" text-anchor="middle" font-family="Arial" font-size="22">PRESS</text><text x="765" y="268" text-anchor="middle" font-family="Arial" font-size="17">TE 135 ms • TR 1570 ms</text><text x="60" y="360" font-family="Arial" font-size="22" font-weight="700">Analysis workflow</text><rect x="60" y="405" width="180" height="75" rx="15" fill="#f7f7f7" stroke="#888"/><text x="150" y="448" text-anchor="middle" font-family="Arial" font-size="18">MRS acquisition</text><text x="270" y="450" font-family="Arial" font-size="30">→</text><rect x="310" y="405" width="180" height="75" rx="15" fill="#f7f7f7" stroke="#888"/><text x="400" y="448" text-anchor="middle" font-family="Arial" font-size="18">SIVIC</text><text x="520" y="450" font-family="Arial" font-size="30">→</text><rect x="560" y="405" width="180" height="75" rx="15" fill="#f7f7f7" stroke="#888"/><text x="650" y="448" text-anchor="middle" font-family="Arial" font-size="18">TARQUIN</text><text x="770" y="450" font-family="Arial" font-size="30">→</text><rect x="810" y="405" width="180" height="75" rx="15" fill="#f7f7f7" stroke="#888"/><text x="900" y="448" text-anchor="middle" font-family="Arial" font-size="18">MATLAB / SPSS</text><text x="1020" y="450" font-family="Arial" font-size="30">→</text><rect x="1060" y="405" width="100" height="75" rx="15" fill="#f7f7f7" stroke="#888"/><text x="1110" y="448" text-anchor="middle" font-family="Arial" font-size="17">ROC</text><text x="60" y="550" font-family="Arial" font-size="22" font-weight="700">Key result</text><text x="60" y="590" font-family="Arial" font-size="19">Pcho/Cr showed the highest diagnostic value (AUC = 0.915)</text><text x="60" y="660" font-family="Arial" font-size="14" fill="#666">Visual layout is original; values and methods summarized from the publication.</text></svg>